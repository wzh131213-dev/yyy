<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨绘 MV 云端项目</title><style>body{font:16px system-ui;max-width:780px;margin:40px auto;padding:0 18px;background:#0b1020;color:#eaf0ff}input,textarea,button{box-sizing:border-box;width:100%;margin:8px 0;padding:12px;border-radius:8px;border:1px solid #34415d;background:#111a30;color:inherit}button{background:#3769ef;border:0;font-weight:700}pre{white-space:pre-wrap;background:#111a30;padding:12px;border-radius:8px}</style><h1>墨绘 MV · 云端素材上传</h1><p>上传真实音频和 LRC 歌词后，Claude 网页端远程连接器可继续分镜、预览与渲染流程。</p><label>访问令牌<input id="token" type="password" autocomplete="off"></label><label>项目标题<input id="title" value="手绘水彩 MV"></label><label>创作构想<textarea id="idea">以水彩、墨线与电影感镜头表现歌曲情绪。</textarea></label><label>时长（秒）<input id="duration" type="number" value="60" min="5" max="600"></label><label>音频文件<input id="audio" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.flac,.opus,.webm"></label><label>LRC 歌词文件<input id="lrc" type="file" accept=".lrc,.txt"></label><button id="send">上传并创建云端项目</button><pre id="out">等待操作…</pre><script>document.querySelector('#send').onclick=async()=>{const out=document.querySelector('#out');out.textContent='上传中…';const f=new FormData();f.append('title',document.querySelector('#title').value);f.append('idea',document.querySelector('#idea').value);f.append('duration_seconds',document.querySelector('#duration').value);for(const k of ['audio','lrc']){const x=document.querySelector('#'+k).files[0];if(x)f.append(k,x)}try{const r=await fetch('/api/projects',{method:'POST',headers:{Authorization:'Bearer '+document.querySelector('#token').value},body:f});const j=await r.json();out.textContent=JSON.stringify(j,null,2)}catch(e){out.textContent='请求失败：'+e.message}};</script></html>
